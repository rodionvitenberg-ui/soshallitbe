<div id="footer-section" class="section">
  <div id="footer-bg"></div>
  <div id="footer-top"></div>
  <div id="footer-middle">
    <div id="footer-middle-contact">
      <a id="footer-contact-address" class="engine-stub" hidden aria-hidden="true" href="#" tabindex="-1"></a>
      <div id="footer-contact-socials">
        <a class="footer-socials-line" href="https://x.com/soshalllitbe5" target="_blank" rel="noopener noreferrer">
          <svg class="footer-socials-line-svg" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M6.948 18.113a.75.75 0 0 1-1.06-1.06l9.885-9.886H8.65a.75.75 0 1 1 0-1.5h9.682v9.682a.75.75 0 0 1-1.5 0v-7.12l-9.884 9.884Z" clip-rule="evenodd"></path></svg>
          <span class="footer-socials-text">{{footer.twitter}}</span>
        </a>
        <a class="footer-socials-line" href="https://www.instagram.com/derweisseberg5/" target="_blank" rel="noopener noreferrer">
          <svg class="footer-socials-line-svg" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M6.948 18.113a.75.75 0 0 1-1.06-1.06l9.885-9.886H8.65a.75.75 0 1 1 0-1.5h9.682v9.682a.75.75 0 0 1-1.5 0v-7.12l-9.884 9.884Z" clip-rule="evenodd"></path></svg>
          <span class="footer-socials-text">{{footer.instagram}}</span>
        </a>
      </div>
      <div id="footer-contact-enquires">
        <div id="footer-enquires-header">{{footer.enquiriesHeader}}</div>
        <a id="footer-enquires-link" href="mailto:{{footer.enquiriesEmail}}">{{footer.enquiriesEmail}}</a>
      </div>
      <div id="footer-contact-business">
        <div id="footer-business-header">{{footer.businessHeader}}</div>
        <a id="footer-business-link" href="mailto:{{footer.businessEmail}}">{{footer.businessEmail}}</a>
      </div>
    </div>
    <div id="footer-middle-newsletter">
      <div id="footer-newsletter-header">
        <span class="footer-newsletter-line">{{footer.newsletterLine1}}</span>
        <span class="footer-newsletter-line" hidden aria-hidden="true"></span>
      </div>
      <!-- Engine form stubs — no visible form UI -->
      <div id="footer-newsletter-input" class="engine-stub" hidden aria-hidden="true">
        <div id="footer-newsletter-bg"></div>
        <form id="footer-newsletter-form" tabindex="-1">
          <input id="footer-newsletter-input-field" type="email" name="EMAIL" autocomplete="off" tabindex="-1" aria-hidden="true">
          <button type="submit" id="footer-newsletter-input-arrow" tabindex="-1" aria-hidden="true"></button>
        </form>
        <div id="footer-newsletter-feedback-message"></div>
      </div>
    </div>
  </div>
  <div id="footer-bottom">
    <div id="footer-bottom-copyright">{{footer.copyright}}</div>
    <a id="footer-bottom-labs" href="https://labs.lusion.co" target="_blank" rel="noopener noreferrer">{{footer.labs}}</a>
    <div id="footer-bottom-tagline">{{footer.tagline}}</div>
    <div id="footer-bottom-up" role="button" tabindex="0" aria-label="Back to top">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24" aria-hidden="true"><path fill="#fff" fill-rule="evenodd" d="M12 22a1 1 0 0 1-1-1V5.857l-6.223 6.224a1 1 0 0 1-1.415-1.415l7.9-7.9a1 1 0 0 1 1.414 0v.001l7.9 7.9a1 1 0 0 1-1.414 1.414L13 5.919V21a1 1 0 0 1-1 1Z" clip-rule="evenodd"></path></svg>
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24" aria-hidden="true"><path fill="#fff" fill-rule="evenodd" d="M12 22a1 1 0 0 1-1-1V5.857l-6.223 6.224a1 1 0 0 1-1.415-1.415l7.9-7.9a1 1 0 0 1 1.414 0v.001l7.9 7.9a1 1 0 0 1-1.414 1.414L13 5.919V21a1 1 0 0 1-1 1Z" clip-rule="evenodd"></path></svg>
    </div>
  </div>
</div>
